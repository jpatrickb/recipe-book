<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting… — Patrick's Recipe Book</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- This page is a compatibility shim for old recipe.html?id=<id> links.
       Recipes now live at their own static URL: /recipes/<id>/ -->
  <main class="main-content">
    <div class="container" style="text-align:center;padding:64px 24px">
      <p>Redirecting to the recipe… If you're not redirected, <a id="fallback-link" href="/">go to all recipes</a>.</p>
    </div>
  </main>

  <script>
    var id = new URLSearchParams(window.location.search).get('id');
    var target = id ? '/recipes/' + encodeURIComponent(id) + '/' : '/';
    document.getElementById('fallback-link').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
